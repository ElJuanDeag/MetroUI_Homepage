services:
  metro-website:
    build:
      context: .
      dockerfile: Dockerfile
      target: metro-runtime
    container_name: metro-website
    restart: unless-stopped
    ports:
      - "${METRO_PORT:-3001}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  cabo-app:
    build:
      context: .
      dockerfile: Dockerfile
      target: cabo-runtime
    container_name: cabo-app
    restart: unless-stopped
    environment:
      PORT: 3002
    ports:
      - "${CABO_PORT:-3002}:3002"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3002"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s